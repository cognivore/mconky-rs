[package]
name = "wallstats"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Typed Rust configuration and collector runtime for Wallstats"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = { version = "=0.38.4", default-features = false, features = ["disk", "network", "system"] }
unicode-segmentation = "1.12"
